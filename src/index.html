<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerfumariaADO02</title>
</head>
<body>
  <div class="content-container">
  <form>
    <h1>Cadastro de Produtos</h1>
    <p class="descricao">
      Preencha os dados abaixo para cadastrar o produto.
    </p>
    <label for="nome">Nome</label>
    <input
      class="input-simples"
      id="nome"
      name="nome"
      type="text"
      placeholder="Digite seu nome"
      [(ngModel)]="produto.nome"
    />

    <label for="marca">Marca</label>
    <input
      class="input-simples"
      id="marca"
      name="marca"
      type="text"
      placeholder="Digite a marca do produto"
      [(ngModel)]="produto.marca"
    />

    <label for="descricao">Descrição</label>
    <input
      class="input-simples"
      id="descricao"
      name="descricao"
      type="text"
      placeholder="Descreva o produto"
      [(ngModel)]="produto.descricao"
    />
    <button type="submit" (click)="cadastrarProduto()">Cadastrar</button>
</div>
<div>
  <h2>Produtos Cadastrados</h2>
  <ul>
    <li *ngFor="let produto of produtos">
      <h3>{{ produto.nome }}</h3>
      <p><strong>Marca:</strong> {{ produto.marca }}</p>
      <p><strong>Descrição:</strong> {{ produto.descricao }}</p>
    </li>
  </ul>
</div>
</body>
</html>
